# ═══════════════════════════════════════════════════════════════
#  站点基础信息
# ═══════════════════════════════════════════════════════════════
baseURL = "https://freewu.github.io"
title = "Bluefrog Pages"
publishDir = "docs"
googleAnalytics = ""

# Remove this when using normally
themesDir = "./themes"
theme = "hugo-developer-portfolio"

# ═══════════════════════════════════════════════════════════════
#  多语言：English（默认，根路径 /） / 简体中文（/zh-cn/） / 繁體中文（/zh-hant/）
#  内容文件命名：xxx.md（英，默认语言） / xxx.zh-cn.md（简） / xxx.zh-hant.md（繁）
#  繁体内容由 `just sync-hant` 从简体内容自动转换生成，勿手改
# ═══════════════════════════════════════════════════════════════
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  # ── English（默认语言，根路径）──────────────────────────────
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1
    title = "Bluefrog Pages"
    [languages.en.params]
      home = "Home"
      languageLabel = "EN"
      description = "Bluefrog (Wu Bin), a full-stack developer in Shenzhen, China: projects, books and tech blog."

  # ── 简体中文（/zh-cn/）───────────────────────────────────
  [languages.zh-cn]
    label = "简体中文"
    locale = "zh-CN"
    weight = 2
    title = "Bluefrog Pages"
    [languages.zh-cn.params]
      home = "首页"
      languageLabel = "简体"
      description = "Bluefrog（伍彬）的个人站点：全栈开发、开源项目与技术博客。"

  # ── 繁體中文（/zh-hant/）──────────────────────────────────
  [languages.zh-hant]
    label = "繁體中文"
    locale = "zh-Hant"
    weight = 3
    title = "Bluefrog Pages"
    [languages.zh-hant.params]
      home = "首頁"
      languageLabel = "繁體"
      description = "Bluefrog（伍彬）的個人站點：全端開發、開源專案與技術部落格。"

# Plugins
[params.plugins]

  # CSS Plugins
  [[params.plugins.css]]
  URL = "https://cdn.jsdelivr.net/npm/uikit@3.2.6/dist/css/uikit.min.css"

  # JS Plugins
  [[params.plugins.js]]
  URL = "https://cdn.jsdelivr.net/npm/uikit@3.2.6/dist/js/uikit.min.js"
  [[params.plugins.js]]
  URL = "https://cdn.jsdelivr.net/npm/uikit@3.2.6/dist/js/uikit-icons.min.js"


# ═══════════════════════════════════════════════════════════════
#  导航（三种语言共用一份配置；菜单名称通过 i18n 键名自动翻译）
#  identifier 同时作为 i18n 键：about / blog / categories / projects / books
#  支持两级菜单：parent / identifier 关联子项
# ═══════════════════════════════════════════════════════════════
[menu]

  [[menu.main]]
  name = "About"
  identifier = "about"
  URL = "about"
  weight = 1

  [[menu.main]]
  name = "Blog"
  identifier = "blog"
  URL = "blog"
  weight = 2

  [[menu.main]]
  name = "Categories"
  identifier = "categories"
  URL = "categories"
  weight = 3

  # ── 二级菜单：Projects ──────────────────────────────────────────
  #    子项 identifier 同时作为图标键，对应 data/icons.yml 里的图标路径
  [[menu.main]]
    name = "Projects"
    identifier = "projects"
    URL = "#"
    weight = 4

  [[menu.main]]
    name = "Magic Tools"
    identifier = "magic-tools"
    parent = "projects"
    URL = "https://freewu.github.io/magic-tools/"
    weight = 1

  [[menu.main]]
    name = "API Manager"
    identifier = "api-manager"
    parent = "projects"
    URL = "https://freewu.github.io/api-manager/"
    weight = 2

  [[menu.main]]
    name = "Cache Manager"
    identifier = "cache-manager"
    parent = "projects"
    URL = "https://freewu.github.io/cache-manager/"
    weight = 3

  [[menu.main]]
    name = "Book Manager"
    identifier = "book-manager"
    parent = "projects"
    URL = "https://freewu.github.io/book-manager/"
    weight = 4

  [[menu.main]]
    name = "DB Manager"
    identifier = "db-manager"
    parent = "projects"
    URL = "https://freewu.github.io/db-manager/"
    weight = 5

  # ── 二级菜单：Books ─────────────────────────────────────────────
  [[menu.main]]
    name = "Books"
    identifier = "books"
    URL = "#"
    weight = 5

  [[menu.main]]
    name = "Chrome Extension Cookbook V3"
    parent = "books"
    URL = "https://freewu.github.io/chrome-extension-cookbook-v3/"
    weight = 1

  [[menu.main]]
    name = "VSCode Extension Cookbook"
    parent = "books"
    URL = "https://freewu.github.io/vscode-extension-cookbook/"
    weight = 2

  [[menu.main]]
    name = "PHP8 Extension Cookbook"
    parent = "books"
    URL = "https://freewu.github.io/php-extension-cookbook/"
    weight = 3


# ═══════════════════════════════════════════════════════════════
#  全局参数（各语言通用）
# ═══════════════════════════════════════════════════════════════
[params]
author = "bluefrog"

[params.contact]
enable = true
formAction = "" #contact form works with formspree.io

[params.footer]
email = "bluefrog.wu@gmail.com"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    noClasses = true
    style = "rainbow_dash"
    tabWidth = 4
